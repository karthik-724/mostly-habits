<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Edit profile · Mostly habits</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="profile">
  <main class="page">
    <a href="profile.html" class="back">Back</a>
    <h1>Edit profile</h1>

    <form id="profile-form" novalidate>
      <fieldset class="options">
        <legend>Icon</legend>
        <div id="icons" class="icons"></div>
      </fieldset>

      <label for="name">Name</label>
      <input id="name" type="text" maxlength="30" placeholder="Your name" autocomplete="off">

      <label for="dob">Date of birth</label>
      <input id="dob" type="date">
      <p class="hint">Only used to wish you a happy birthday.</p>

      <p id="error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">Save changes</button>
    </form>
  </main>
  <script src="js/store.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/profile-edit.js"></script>
</body>
</html>
