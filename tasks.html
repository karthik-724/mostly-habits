<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Tasks · Mostly habits</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="tasks">
  <header class="topbar">
    <div class="topbar-in">
      <h1>Tasks</h1>
      <a href="profile.html" id="profile-btn" class="avatar avatar-btn" aria-label="Profile"></a>
    </div>
  </header>
  <main class="page">

    <div class="chips" role="group" aria-label="View">
      <button type="button" id="chip-tasks" class="chip" aria-pressed="true">Tasks</button>
      <button type="button" id="chip-lists" class="chip" aria-pressed="false">Lists</button>
    </div>

    <div id="tasks-view">
      <ul id="task-list" class="list"></ul>
      <p id="empty" class="empty" hidden>No tasks yet. Tap + to add your first one.</p>
      <section id="done-section" hidden>
        <div class="section-head"><h2>Completed</h2></div>
        <ul id="done-list" class="list"></ul>
      </section>
    </div>

    <div id="lists-view" hidden>
      <ul id="list-of-lists" class="list"></ul>
      <p id="lists-empty" class="empty" hidden>No lists yet. Tap + to create one.</p>
    </div>
  </main>

  <div id="add-menu" class="add-menu" role="menu" aria-label="Add" hidden>
    <a href="add-task.html" class="menu-item" role="menuitem" id="menu-task">Task</a>
    <a href="list.html" class="menu-item" role="menuitem" id="menu-list">List</a>
  </div>
  <button type="button" id="fab" class="fab" aria-label="Add" aria-haspopup="menu"
          aria-expanded="false" aria-controls="add-menu">+</button>

  <script src="js/store.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/task-logic.js"></script>
  <script src="js/task-card.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/add-menu.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
